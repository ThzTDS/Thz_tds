[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thz_tds"
version = "0.1.0"
description = "THz time-domain spectroscopy: data loading, alignment, Fabry-Perot removal, and optical-constant extraction"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

authors = [
    { name = "Your Name", email = "you@institution.ac.uk" }
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

dependencies = [
    "numpy>=1.24",
    "pandas>=1.5",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "mypy",
]

[tool.setuptools]
packages = ["thz_tds"]

[tool.setuptools.package-data]
thz_tds = ["../config/default_config.yaml"]

[project.urls]
"Repository" = "https://github.com/yourorg/thz_tds"
