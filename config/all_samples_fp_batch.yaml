# ── Shared settings (apply to all samples) ──────────────────
loading:
  correction_factor: 0.0414
  # Limit the number of traces loaded per dataset (null = load all).
  # Set to a small number (e.g. 10) for fast testing.
  max_traces: 10 #null

alignment:
  enabled:        true
  method:         "gaussian_median_integer"
  corr_window_ps: null
  adaptive_fit_window: true
  fit_window_sigma_factor: 5.0
  fallback_fit_window_ps: 15.0
  min_sigma_ps: 0.05
  max_sigma_ps: 10.0
  min_fit_points: 10
  max_center_shift_ps: 5.0
  air_prefix:     air
  point_prefix:   point
  n_points:    null     # null = all found; set e.g. 5 to limit

refractive_index:
  f_low_THz:  0.4
  f_high_THz: 1.1
  skip_fp:    true          # set true to skip Fabry-Perot correction

# Settings used only by cielecki_material_features.py.
# Overrides refractive_index.f_low/f_high for feature extraction.
features:
  f_low_THz:  0.4
  f_high_THz: 1.0           # upper bound for n_mean and beta fit

plot:
  figure_size:    [14, 6]
  dpi:            150          # lower for batch speed; raise to 300 for final
  formats:        [png]        # add pdf for publication output
  errorbar_step:  15           # draw error bars every N frequency points
  n_traces_plot:  10           # max individual traces to draw; null = all

output: /mnt/samples/results/fp_batch
